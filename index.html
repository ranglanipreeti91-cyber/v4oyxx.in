<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>V4OYXX!</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-width: 0;
            min-height: 100%;
        }

        html {
            background: #000;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;

            background: #000;

            color: #fff;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        img,
        video {
            display: block;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           BACKGROUND VIDEO
           ========================================================= */

        #background {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            min-width: 100%;
            min-height: 100%;

            object-fit: cover;
            object-position: center center;

            background: #000;

            z-index: 0;

            pointer-events: none;

            transform: translateZ(0);

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;
        }

        /* Dark layer above the video */
        .video-darkness {
            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.58)
                );

            z-index: 1;

            pointer-events: none;
        }

        /* Subtle vignette */
        .vignette {
            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 25%,
                    rgba(0, 0, 0, 0.45) 100%
                );

            z-index: 2;

            pointer-events: none;
        }

        /* =========================================================
           START SCREEN
           ========================================================= */

        #start-screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));

            background: #000;

            z-index: 100;

            cursor: pointer;

            transition:
                opacity 0.55s ease,
                visibility 0.55s ease;
        }

        #start-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-box {
            text-align: center;

            width: min(90vw, 500px);

            padding: 32px 24px;
        }

        .start-title {
            font-size: clamp(24px, 7vw, 42px);

            font-weight: 800;

            letter-spacing: -0.03em;

            margin-bottom: 12px;
        }

        .start-subtitle {
            color: rgba(255, 255, 255, 0.58);

            font-size: clamp(13px, 3.5vw, 15px);

            line-height: 1.6;

            margin-bottom: 24px;
        }

        .start-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 150px;
            min-height: 50px;

            padding: 12px 24px;

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.08);

            color: #fff;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.02em;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        #start-screen:active .start-button {
            transform: scale(0.96);
        }

        @media (hover: hover) {
            #start-screen:hover .start-button {
                background:
                    rgba(255, 255, 255, 0.13);

                border-color:
                    rgba(255, 255, 255, 0.3);

                transform:
                    translateY(-2px);
            }
        }

        /* =========================================================
           PAGE
           ========================================================= */

        .page {
            position: relative;

            z-index: 3;

            width: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                80px 20px
                110px;
        }

        /* =========================================================
           PROFILE CARD
           ========================================================= */

        .profile-card {
            width: min(100%, 560px);

            padding: 28px;

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            border-radius: 24px;

            background:
                rgba(10, 10, 10, 0.38);

            box-shadow:
                0 25px 90px
                rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }

        .profile-card.hidden {
            opacity: 0;
            transform: translateY(20px);
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .profile-header {
            display: flex;

            align-items: center;

            gap: 18px;
        }

        .profile-picture-wrap {
            flex: 0 0 auto;
        }

        .profile-picture {
            width: 92px;
            height: 92px;

            border-radius: 50%;

            object-fit: cover;
            object-position: center;

            border:
                2px solid
                rgba(255, 255, 255, 0.24);

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.3);
        }

        .profile-info {
            min-width: 0;
            flex: 1;
        }

        .profile-name {
            font-size: clamp(23px, 6vw, 34px);

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -0.04em;

            overflow-wrap: anywhere;
        }

        .verified {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 20px;
            height: 20px;

            margin-left: 4px;

            border-radius: 50%;

            background: #fff;

            color: #000;

            font-size: 12px;

            vertical-align: middle;
        }

        .profile-bio {
            margin-top: 9px;

            color:
                rgba(255, 255, 255, 0.67);

            font-size: 14px;

            line-height: 1.6;

            overflow-wrap: anywhere;
        }

        /* =========================================================
           SEPARATOR
           ========================================================= */

        .separator {
            width: 100%;
            height: 1px;

            margin:
                24px 0;

            background:
                rgba(255, 255, 255, 0.11);
        }

        /* =========================================================
           SOCIAL LINKS
           ========================================================= */

        .socials {
            display: flex;

            align-items: center;

            justify-content: center;

            flex-wrap: wrap;

            gap: 11px;
        }

        .social-link {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.055);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .social-link img {
            width: 22px;
            height: 22px;

            object-fit: contain;
        }

        @media (hover: hover) {
            .social-link:hover {
                transform: translateY(-3px);

                background:
                    rgba(255, 255, 255, 0.11);

                border-color:
                    rgba(255, 255, 255, 0.23);
            }
        }

        .social-link:active {
            transform: scale(0.94);
        }

        /* =========================================================
           VIEWS
           ========================================================= */

        .views {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color:
                rgba(255, 255, 255, 0.56);

            font-size: 12px;
        }

        .eye {
            width: 16px;
            height: 16px;
        }

        /* =========================================================
           SKILLS
           ========================================================= */

        .skills {
            margin-top: 28px;
        }

        .skills-title {
            margin-bottom: 16px;

            text-align: center;

            font-size: 17px;

            font-weight: 700;
        }

        .skill {
            margin-bottom: 15px;
        }

        .skill:last-child {
            margin-bottom: 0;
        }

        .skill-top {
            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 7px;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.72);
        }

        .skill-top img {
            width: 18px;
            height: 18px;

            object-fit: contain;
        }

        .skill-percent {
            margin-left: auto;
        }

        .bar {
            width: 100%;
            height: 6px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.09);
        }

        .bar-fill {
            height: 100%;

            border-radius: inherit;

            background: #fff;

            transform-origin: left center;

            animation:
                barIn 1s ease forwards;
        }

        .python {
            width: 87%;
        }

        .cpp {
            width: 75%;
        }

        @keyframes barIn {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        /* =========================================================
           CONTROLS
           ========================================================= */

        .controls {
            position: fixed;

            left: 50%;

            bottom:
                max(20px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%);

            z-index: 20;

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 16px;

            background:
                rgba(8, 8, 8, 0.5);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .control-button {
            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.06);

            color: #fff;

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .control-button.active {
            background:
                rgba(255, 255, 255, 0.16);
        }

        .control-button:active {
            transform: scale(0.92);
        }

        /* =========================================================
           AUDIO CONTROL
           ========================================================= */

        .audio-control {
            position: fixed;

            top: max(18px, env(safe-area-inset-top));
            right: max(18px, env(safe-area-inset-right));

            z-index: 20;

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 9px 12px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 14px;

            background:
                rgba(8, 8, 8, 0.5);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .audio-button {
            width: 34px;
            height: 34px;

            border: 0;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.08);

            color: #fff;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .volume-slider {
            width: 80px;

            accent-color: #fff;

            cursor: pointer;
        }

        /* =========================================================
           ERROR NOTICE
           ========================================================= */

        #video-error {
            position: fixed;

            left: 50%;
            bottom: 85px;

            transform: translateX(-50%);

            width: min(
                calc(100vw - 32px),
                520px
            );

            padding: 12px 15px;

            text-align: center;

            border:
                1px solid
                rgba(255, 100, 100, 0.2);

            border-radius: 12px;

            background:
                rgba(35, 0, 0, 0.55);

            color:
                rgba(255, 210, 210, 0.9);

            font-size: 11px;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.3s ease;

            z-index: 30;
        }

        #video-error.show {
            opacity: 1;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            #background {
                width: 100vw;
                height: 100dvh;

                object-fit: cover;
                object-position: center center;
            }

            .page {
                align-items: center;

                padding:
                    70px 14px
                    105px;
            }

            .profile-card {
                width: 100%;

                max-width: 520px;

                padding: 20px;

                border-radius: 20px;
            }

            .profile-header {
                gap: 14px;
            }

            .profile-picture {
                width: 72px;
                height: 72px;
            }

            .profile-name {
                font-size: clamp(
                    21px,
                    7vw,
                    30px
                );
            }

            .profile-bio {
                font-size: 13px;
            }

            .audio-control {
                padding: 8px 9px;
            }

            .volume-slider {
                width: 65px;
            }
        }

        @media (max-width: 430px) {

            .page {
                padding:
                    65px 10px
                    100px;
            }

            .profile-card {
                padding: 17px;

                border-radius: 18px;
            }

            .profile-header {
                align-items: flex-start;
            }

            .profile-picture {
                width: 62px;
                height: 62px;
            }

            .social-link {
                width: 42px;
                height: 42px;
            }

            .social-link img {
                width: 20px;
                height: 20px;
            }

            .volume-slider {
                display: none;
            }

            .controls {
                gap: 5px;
                padding: 6px;
            }

            .control-button {
                width: 36px;
                height: 36px;
            }
        }

        /* =========================================================
           VERY NARROW PHONES
           ========================================================= */

        @media (max-width: 340px) {

            .profile-header {
                gap: 10px;
            }

            .profile-picture {
                width: 55px;
                height: 55px;
            }

            .profile-name {
                font-size: 20px;
            }

            .profile-bio {
                font-size: 12px;
            }
        }

        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

         BACKGROUND VIDEO

         ========================================================= -->

        id="background-music"
        loop
        preload="auto"
    >

            src="assets/background_music.mp3"
            type="audio/mpeg"
        >
    </audio>

    <script>

        /* =========================================================
           ELEMENTS
           ========================================================= */

        const startScreen =
            document.getElementById("start-screen");

        const backgroundVideo =
            document.getElementById("background");

        const backgroundMusic =
            document.getElementById("background-music");

        const audioButton =
            document.getElementById("audio-button");

        const volumeSlider =
            document.getElementById("volume-slider");

        const videoError =
            document.getElementById("video-error");

        const profileCard =
            document.getElementById("profile-card");

        const controlButtons =
            document.querySelectorAll(".control-button");


        /* =========================================================
           AUDIO
           ========================================================= */

        let musicEnabled = true;

        let volume =
            Number(volumeSlider.value);


        backgroundMusic.volume = volume;

        backgroundMusic.muted = false;


        function updateAudioIcon() {

            if (!musicEnabled || backgroundMusic.muted) {

                audioButton.textContent = "🔇";

                return;
            }

            if (volume <= 0) {

                audioButton.textContent = "🔇";

                return;
            }

            audioButton.textContent = "🔊";
        }


        async function playMusic() {

            backgroundMusic.volume =
                Number(volumeSlider.value);

            backgroundMusic.muted = false;

            try {

                await backgroundMusic.play();

                musicEnabled = true;

                updateAudioIcon();

            } catch (error) {

                console.log(
                    "Music playback waiting for user gesture."
                );

            }
        }


        function stopMusic() {

            backgroundMusic.pause();

            musicEnabled = false;

            updateAudioIcon();
        }


        audioButton.addEventListener(
            "click",
            async () => {

                if (
                    backgroundMusic.paused ||
                    !musicEnabled
                ) {

                    musicEnabled = true;

                    await playMusic();

                } else {

                    stopMusic();

                }

            }
        );


        volumeSlider.addEventListener(
            "input",
            () => {

                volume =
                    Number(volumeSlider.value);

                backgroundMusic.volume =
                    volume;

                if (volume > 0 && backgroundMusic.paused) {

                    playMusic();

                }

                updateAudioIcon();

            }
        );


        /* =========================================================
           BACKGROUND VIDEO
           ========================================================= */

        async function playBackgroundVideo() {

            if (!backgroundVideo) {
                return;
            }

            backgroundVideo.muted = true;
            backgroundVideo.loop = true;
            backgroundVideo.playsInline = true;

            try {

                await backgroundVideo.play();

            } catch (error) {

                console.log(
                    "Video autoplay blocked."
                );

            }
        }


        backgroundVideo.addEventListener(
            "loadeddata",
            () => {

                playBackgroundVideo();

            }
        );


        backgroundVideo.addEventListener(
            "canplay",
            () => {

                playBackgroundVideo();

            }
        );


        backgroundVideo.addEventListener(
            "error",
            () => {

                videoError.classList.add("show");

                setTimeout(
                    () => {
                        videoError.classList.remove("show");
                    },
                    5000
                );

            }
        );


        /* =========================================================
           ENTER SITE
           IMPORTANT FOR MOBILE AUDIO
           ========================================================= */

        let entered = false;


        async function enterSite(event) {

            if (entered) {
                return;
            }

            entered = true;


            /*
             * This function is triggered directly from a
             * user tap/click.
             *
             * That's important for mobile browsers because
             * audio playback usually requires a user gesture.
             */

            backgroundMusic.muted = false;

            backgroundMusic.volume =
                Number(volumeSlider.value);


            try {

                await backgroundMusic.play();

                musicEnabled = true;

            } catch (error) {

                console.log(
                    "Music still blocked by browser."
                );

            }


            playBackgroundVideo();


            startScreen.classList.add("hide");


            profileCard.classList.remove("hidden");


            updateAudioIcon();

        }


        startScreen.addEventListener(
            "pointerdown",
            enterSite,
            {
                passive: true,
                once: true
            }
        );


        startScreen.addEventListener(
            "click",
            enterSite,
            {
                once: true
            }
        );


        /* =========================================================
           FALLBACK USER GESTURE
           ========================================================= */

        document.addEventListener(
            "pointerdown",
            () => {

                if (
                    backgroundVideo.paused
                ) {

                    playBackgroundVideo();

                }

                if (
                    !startScreen.classList.contains("hide") === false &&
                    backgroundMusic.paused &&
                    musicEnabled
                ) {

                    playMusic();

                }

            },
            {
                passive: true
            }
        );


        /* =========================================================
           CONTROLS
           ========================================================= */

        controlButtons.forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        controlButtons.forEach(
                            (item) => {
                                item.classList.remove(
                                    "active"
                                );
                            }
                        );

                        button.classList.add(
                            "active"
                        );


                        const action =
                            button.dataset.action;


                        /*
                         * 1 = normal
                         */

                        if (action === "home") {

                            backgroundVideo.style.filter =
                                "none";

                            backgroundVideo.style.transform =
                                "none";

                            profileCard.style.opacity =
                                "1";

                        }


                        /*
                         * 2 = slightly brighter
                         */

                        if (action === "focus") {

                            backgroundVideo.style.filter =
                                "brightness(1.15) contrast(1.05)";

                            backgroundVideo.style.transform =
                                "scale(1.03)";

                            profileCard.style.opacity =
                                "1";

                        }


                        /*
                         * 3 = slightly blurred
                         */

                        if (action === "blur") {

                            backgroundVideo.style.filter =
                                "blur(3px) brightness(0.8)";

                            backgroundVideo.style.transform =
                                "scale(1.04)";

                            profileCard.style.opacity =
                                "1";

                        }


                        /*
                         * 4 = darker
                         */

                        if (action === "dim") {

                            backgroundVideo.style.filter =
                                "brightness(0.55)";

                            backgroundVideo.style.transform =
                                "scale(1.02)";

                            profileCard.style.opacity =
                                "0.92";

                        }


                        /*
                         * 5 = reset
                         */

                        if (action === "normal") {

                            backgroundVideo.style.filter =
                                "none";

                            backgroundVideo.style.transform =
                                "none";

                            profileCard.style.opacity =
                                "1";

                        }

                    }
                );

            }
        );


        /* =========================================================
           RESIZE
           ========================================================= */

        function resizeVideo() {

            if (!backgroundVideo) {
                return;
            }

            backgroundVideo.style.width =
                "100vw";

            backgroundVideo.style.height =
                "100dvh";

        }


        window.addEventListener(
            "resize",
            resizeVideo
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    resizeVideo,
                    100
                );

            }
        );


        /* =========================================================
           INITIALIZE
           ========================================================= */

        resizeVideo();

        updateAudioIcon();

        playBackgroundVideo();

    </script>

</body>
</html>
